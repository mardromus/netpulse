[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netpulse"
version = "1.0.0"
description = "AI-generated analytics and anomaly reports from network counters and metrics"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kushagra Goyal" }]
requires-python = ">=3.10"
keywords = ["network", "observability", "anomaly-detection", "aiops", "llm", "reporting"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "plotly>=5.18",
  "jinja2>=3.1",
  "typer>=0.12",
  "rich>=13",
  "httpx>=0.27",
  "psutil>=5.9",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "ruff>=0.5", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
netpulse = "netpulse.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
netpulse = ["report/templates/*.j2", "server/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]
