name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest

  report:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Generate data, detect, evaluate and report
        run: netpulse demo --out out
      - name: Detection must stay perfect on the reference week
        run: netpulse eval out/demo.db | tee eval.txt && grep -q "F1 1.0" eval.txt
      - uses: actions/upload-artifact@v4
        with:
          name: netpulse-report
          path: out/netpulse-report.*
